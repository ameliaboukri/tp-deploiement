name: CI/CD
on:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest requests
      - run: python -m pytest tests/test_unit.py

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myapp:test .
      - run: docker run -d -p 8000:8000 --name myapp myapp:test
      - run: sleep 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: python -m pytest tests/test_e2e.py
      - run: docker rm -f myapp

  build-and-push:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} .
      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy on Azure VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
            docker rm -f boukri_amelia || true
            docker run -d --name boukri_amelia -p 8006:8000 ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
            sleep 5
            curl --fail http://localhost:8006/health